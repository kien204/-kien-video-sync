<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TikTok Authorization Callback</title>
</head>
<body style="font-family:system-ui;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6">
  <h2>Authorization Complete</h2>
  <p>Copy the full URL from your browser address bar (or the code below) and paste it into <code>get_tiktok_token.py</code>:</p>
  <pre id="code" style="padding:12px;background:#f5f5f5;border:1px solid #ddd;word-break:break-all"></pre>
  <script>
    const code = new URLSearchParams(window.location.search).get("code") || "";
    document.getElementById("code").textContent = code || "No authorization code found in URL.";
  </script>
</body>
</html>
